# Denon Advanced Audio -- Example Home Assistant dashboard card
# Paste this YAML as a single manual card in your Lovelace dashboard.
# The layout mirrors Denon's own web control page structure.

type: vertical-stack
title: Denon
cards:
  - type: entities
    title: Zones
    show_header_toggle: false
    state_color: true
    entities:
      - entity: switch.denon_main_zone_power
        name: Main Zone
        icon: mdi:power
      - entity: switch.denon_zone2_power
        name: Zone 2
        icon: mdi:power
      - entity: switch.denon_zone_3_power
        name: Zone 3
        icon: mdi:power
      - entity: switch.denon_zone_4_power
        name: Zone 4
        icon: mdi:power

  - type: entities
    title: Speaker Preset
    show_header_toggle: false
    entities:
      - entity: select.denon_speaker_preset
        name: Preset
        icon: mdi:surround-sound

  - type: entities
    title: Audyssey
    show_header_toggle: false
    state_color: true
    entities:
      - entity: select.denon_multeq_xt32
        name: MultEQ XT32
        icon: mdi:tune
      - entity: switch.denon_dynamic_eq
        name: Dynamic EQ
        icon: mdi:equalizer
      - entity: select.denon_dynamic_volume
        name: Dynamic Volume
        icon: mdi:volume-high
      - entity: select.denon_reference_level_offset
        name: Reference Level Offset
        icon: mdi:volume-equal
      - entity: switch.denon_lfc
        name: LFC
        icon: mdi:sine-wave
      - entity: number.denon_containment_amount
        name: Containment Amount
        icon: mdi:waveform

  - type: entities
    title: Volume
    show_header_toggle: false
    entities:
      - entity: select.denon_volume_scale
        name: Scale
        icon: mdi:tune-vertical
      - entity: select.denon_volume_limit
        name: Limit
        icon: mdi:volume-minus
      - entity: select.denon_power_on_level
        name: Power On Level
        icon: mdi:power-standby
      - entity: select.denon_mute_level
        name: Mute Level
        icon: mdi:volume-mute

  - type: entities
    title: Audio
    show_header_toggle: false
    state_color: true
    entities:
      - entity: select.denon_restorer
        name: Restorer
        icon: mdi:music-circle-outline
      - entity: number.denon_subwoofer_level_1
        name: Subwoofer Level 1
        icon: mdi:speaker
      - entity: number.denon_subwoofer_level_2
        name: Subwoofer Level 2
        icon: mdi:speaker
      - entity: switch.denon_auto_lip_sync
        name: Auto Lip Sync
        icon: mdi:sync
      - entity: number.denon_audio_delay
        name: Audio Delay
        icon: mdi:sync-circle

  - type: entities
    title: General & ECO
    show_header_toggle: false
    entities:
      - entity: select.denon_eco_mode
        name: ECO Mode
        icon: mdi:leaf
      - entity: select.denon_power_on_default
        name: Power On Default
        icon: mdi:power-standby
      - entity: select.denon_on_screen_display
        name: On Screen Display
        icon: mdi:monitor
      - entity: select.denon_auto_standby_main_zone
        name: Auto Standby Main
        icon: mdi:sleep
      - entity: select.denon_auto_standby_zone_2
        name: Auto Standby Zone 2
        icon: mdi:sleep

  - type: entities
    title: Network
    show_header_toggle: false
    state_color: true
    entities:
      - entity: select.denon_network_control
        name: Network Control
        icon: mdi:lan
      - entity: switch.denon_airplay
        name: AirPlay
        icon: mdi:cast-audio
